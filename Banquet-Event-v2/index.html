<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#5c4a66">
  <title>Banquet & Event — Queensland & Baiyoke Sky</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="login" class="screen">
  <div class="login-card">
    <div class="logos"><div class="logo-mark">B&E</div></div>
    <h1>Banquet & Event</h1>
    <p>Queensland · Baiyoke Sky</p>
    <label>รหัสผู้ใช้<input id="loginUser" placeholder="เช่น ADMIN" autocomplete="username"></label>
    <label>รหัสผ่าน<input id="loginPin" type="password" placeholder="••••" autocomplete="current-password"></label>
    <button class="primary full" id="loginBtn">เข้าสู่ระบบ</button>
    <div id="loginError" class="error"></div>
  </div>
</div>

<div id="app" class="app hidden">
  <header class="topbar">
    <div class="brand"><div class="logo-mark small">B&E</div><div><b>Banquet & Event</b><span id="hotelTitle">Queensland</span></div></div>
    <div class="top-actions"><span id="syncStatus" class="sync">กำลังเริ่ม…</span><span id="userName"></span><button class="ghost" id="logoutBtn">ออก</button></div>
  </header>

  <div class="hotel-tabs" id="hotelTabs">
    <button data-hotel="QL">Queensland</button><button data-hotel="BY">Baiyoke Sky</button><button data-hotel="ALL">รวม 2 แห่ง</button>
  </div>

  <nav class="nav-tabs">
    <button class="active" data-view="events">รวมงาน</button>
    <button data-view="settings">ตั้งค่า</button>
  </nav>

  <main id="view-events">
    <section class="toolbar card">
      <div><h2>งานจัดเลี้ยง</h2><p>จัดการ Event, ใบสั่งงาน และเมนูของแต่ละงาน</p></div>
      <button class="primary" id="addEventBtn">＋ เพิ่มงาน</button>
    </section>
    <section id="eventList" class="event-list"></section>
  </main>

  <main id="view-settings" class="hidden">
    <section class="card"><div class="section-head"><div><h2>ตั้งค่า</h2><p>ข้อมูลมาตรฐานจะเก็บใน Supabase เดิม</p></div></div>
      <div class="settings-tabs"><button class="active" data-settings="menus">ชุดเมนู</button><button data-settings="rooms">ห้องจัดงาน</button></div>
      <div id="settingsBody"></div>
    </section>
  </main>
</div>

<div id="modal" class="modal hidden"><div class="modal-box" id="modalBox"></div></div>
<div id="toast" class="toast"></div>
<script src="js/config.js"></script>
<script src="js/defaults.js"></script>
<script src="js/state.js"></script>
<script src="js/database.js"></script>
<script src="js/menus.js"></script>
<script src="js/events.js"></script>
<script src="js/settings.js"></script>
<script src="js/app.js"></script>
</body>
</html>
